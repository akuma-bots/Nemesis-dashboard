<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ñ - ÑÊMESIS // Missões</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#080808;
    --panel:#0f0f10;
    --panel-2:#151516;
    --signal:#ffffff;
    --steel:#9a9a9a;
    --white:#eaeaea;
    --line:rgba(255,255,255,0.16);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    background:var(--void);
    color:var(--white);
    font-family:'Rajdhani',sans-serif;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  .wordmark{
    font-family:'Audiowide',sans-serif;
    letter-spacing:.04em;
  }

  main{
    max-width:1000px;
    margin:0 auto;
    padding:140px 6vw 100px;
  }

  .voltar{
    display:inline-block;
    font-size:.78rem;
    letter-spacing:.08em;
    color:var(--steel);
    text-transform:uppercase;
    margin-bottom:34px;
  }

  .voltar:hover{
    color:var(--signal);
  }

  h1{
    font-family:'Audiowide';
    font-size:clamp(1.7rem,4vw,2.6rem);
  }

  .subtitulo{
    margin-top:14px;
    color:var(--steel);
    line-height:1.6;
    max-width:650px;
  }

  h2.secao{
    font-family:'Audiowide';
    font-size:1.05rem;
    margin:56px 0 22px;
    letter-spacing:.02em;
  }

  .grade{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }

  .cartao{
    background:var(--panel);
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .selo{
    font-family:'Audiowide';
    font-size:.66rem;
    letter-spacing:.1em;
    color:var(--signal);
    text-transform:uppercase;
  }

  .cartao h3{
    font-family:'Audiowide';
    font-size:.95rem;
  }

  .cartao p{
    color:var(--steel);
    font-size:.86rem;
    line-height:1.55;
    flex:1;
  }

  .cartao .pontos{
    font-family:'Audiowide';
    font-size:.85rem;
  }

  .btn{
    font-family:'Rajdhani';
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:.78rem;
    padding:11px 20px;
    cursor:pointer;
    border:1px solid var(--signal);
    background:transparent;
    color:var(--white);
    transition:all .2s;
    text-align:center;
  }

  .btn-primario{
    background:var(--signal);
    color:#080808;
  }

  .btn-primario:hover{
    opacity:.85;
  }

  .vazio{
    color:var(--steel);
    font-size:.9rem;
    padding:20px 0;
  }

  .sobreposicao{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }

  .sobreposicao.aberta{
    display:flex;
  }

  .caixa-modal{
    background:var(--panel);
    border:1px solid var(--line);
    padding:28px;
    width:100%;
    max-width:420px;
  }

  .caixa-modal h3{
    font-family:'Audiowide';
    font-size:1rem;
    margin-bottom:16px;
  }

  .caixa-modal input[type="file"]{
    width:100%;
    margin-bottom:16px;
    color:var(--steel);
    font-size:.85rem;
  }

  .linha-acoes{
    display:flex;
    gap:10px;
  }

  .btn-secundario{
    border-color:var(--line);
    color:var(--steel);
  }

  .status-modal{
    font-size:.8rem;
    color:var(--signal);
    margin-top:10px;
    min-height:1.2em;
  }
</style>
</head>

<body>

<main>

  <a class="voltar" href="/">← Voltar pra home</a>

  <h1 class="wordmark">Missões</h1>

  <p class="subtitulo">
    Complete missões, contribua com a NÊMESIS e participe de desafios especiais.
    Envie sua prova e receba os pontos após a aprovação da staff.
  </p>

  <!-- MISSÕES -->
  <h2 class="secao">Missões</h2>
  <div class="grade" id="grade-missoes">
    <p class="vazio">Carregando…</p>
  </div>

  <!-- CONTRIBUIÇÃO -->
  <h2 class="secao">Contribuição</h2>
  <div class="grade" id="grade-contribuicao">
    <p class="vazio">Carregando…</p>
  </div>

  <!-- MISSÕES ESPECIAIS -->
  <h2 class="secao">Missões Especiais</h2>
  <div class="grade" id="grade-especiais">
    <p class="vazio">Carregando…</p>
  </div>

</main>

<div class="sobreposicao" id="modal">

  <div class="caixa-modal">

    <h3 id="modal-titulo">Enviar prova</h3>

    <input
      type="file"
      id="modal-arquivo"
      accept="image/*"
    >

    <div class="linha-acoes">

      <button
        class="btn btn-primario"
        id="modal-enviar"
        style="flex:1;"
      >
        Enviar
      </button>

      <button
        class="btn btn-secundario"
        onclick="fecharModal()"
        style="flex:1;"
      >
        Cancelar
      </button>

    </div>

    <div
      class="status-modal"
      id="modal-status"
    ></div>

  </div>

</div>

<script>

function escaparHtml(texto){
  return String(texto ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

let missaoSelecionada = null;

function nomeTipo(tipo){

  switch(String(tipo || '').toLowerCase()){

    case 'pvp':
      return 'MISSÃO';

    case 'pve':
      return 'CONTRIBUIÇÃO';

    case 'especial':
    case 'especiais':
    case 'missao_especial':
    case 'missao-especial':
      return 'MISSÃO ESPECIAL';

    default:
      return 'MISSÃO';

  }

}

function cartaoMissao(m){

  const div = document.createElement('div');

  div.className = 'cartao';

  div.innerHTML = `
    <span class="selo">
      ${escaparHtml(nomeTipo(m.tipo))}
    </span>

    <h3>
      ${escaparHtml(m.titulo)}
    </h3>

    <p>
      ${escaparHtml(m.descricao)}
    </p>

    <span class="pontos">
      +${Number(m.pontos || 0)} pontos
    </span>

    <button class="btn btn-primario">
      Enviar prova
    </button>
  `;

  div.querySelector('button').onclick = () => abrirModal(m);

  return div;
}

function abrirModal(m){

  missaoSelecionada = m;

  document.getElementById('modal-titulo').textContent =
    `Enviar prova — ${m.titulo}`;

  document.getElementById('modal-arquivo').value = '';

  document.getElementById('modal-status').textContent = '';

  document
    .getElementById('modal')
    .classList
    .add('aberta');

}

function fecharModal(){

  document
    .getElementById('modal')
    .classList
    .remove('aberta');

}

document.getElementById('modal-enviar').onclick = async () => {

  const input =
    document.getElementById('modal-arquivo');

  const arquivo = input.files[0];

  const status =
    document.getElementById('modal-status');

  if(!arquivo){

    status.textContent =
      'Escolhe uma imagem primeiro.';

    return;

  }

  if(arquivo.size > 1_500_000){

    status.textContent =
      'Imagem muito grande (máx 1.5MB).';

    return;

  }

  status.textContent = 'Enviando…';

  const leitor = new FileReader();

  leitor.onload = async () => {

    try{

      const resp = await fetch(
        '/.netlify/functions/missoes-enviar-prova',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            missaoId:missaoSelecionada.id,
            imagemBase64:leitor.result
          })
        }
      );

      if(resp.status === 401){

        status.innerHTML =
          'Você precisa <a href="/login" style="color:var(--signal)">entrar com Discord</a> primeiro.';

        return;

      }

      if(!resp.ok){

        const erro = await resp.json().catch(() => ({}));

        throw new Error(
          erro.erro || 'Erro ao enviar.'
        );

      }

      status.textContent =
        'Enviado! Aguarde a staff revisar.';

      setTimeout(
        fecharModal,
        1800
      );

    }catch(e){

      status.textContent =
        e.message || 'Não deu pra enviar. Tenta de novo.';

    }

  };

  leitor.readAsDataURL(arquivo);

};

async function carregarMissoes(){

  const gradeMissoes =
    document.getElementById('grade-missoes');

  const gradeContribuicao =
    document.getElementById('grade-contribuicao');

  const gradeEspeciais =
    document.getElementById('grade-especiais');

  try{

    const resp = await fetch(
      '/.netlify/functions/missoes-get'
    );

    if(!resp.ok){
      throw new Error();
    }

    const d = await resp.json();

    gradeMissoes.innerHTML = '';
    gradeContribuicao.innerHTML = '';
    gradeEspeciais.innerHTML = '';

    const missoes = Array.isArray(d.missoes)
      ? d.missoes
      : [];

    const listaMissoes = missoes.filter(
      m => String(m.tipo).toLowerCase() === 'pvp'
    );

    const listaContribuicao = missoes.filter(
      m => String(m.tipo).toLowerCase() === 'pve'
    );

    const listaEspeciais = missoes.filter(
      m => [
        'especial',
        'especiais',
        'missao_especial',
        'missao-especial'
      ].includes(
        String(m.tipo).toLowerCase()
      )
    );

    listaMissoes.forEach(
      m => gradeMissoes.appendChild(
        cartaoMissao(m)
      )
    );

    listaContribuicao.forEach(
      m => gradeContribuicao.appendChild(
        cartaoMissao(m)
      )
    );

    listaEspeciais.forEach(
      m => gradeEspeciais.appendChild(
        cartaoMissao(m)
      )
    );

    if(!listaMissoes.length){

      gradeMissoes.innerHTML =
        '<p class="vazio">Nenhuma missão ativa agora.</p>';

    }

    if(!listaContribuicao.length){

      gradeContribuicao.innerHTML =
        '<p class="vazio">Nenhuma contribuição ativa agora.</p>';

    }

    if(!listaEspeciais.length){

      gradeEspeciais.innerHTML =
        '<p class="vazio">Nenhuma missão especial ativa agora.</p>';

    }

  }catch(e){

    gradeMissoes.innerHTML =
      '<p class="vazio">Não deu pra carregar agora.</p>';

    gradeContribuicao.innerHTML =
      '<p class="vazio">Não deu pra carregar agora.</p>';

    gradeEspeciais.innerHTML =
      '<p class="vazio">Não deu pra carregar agora.</p>';

  }

}

carregarMissoes();

</script>

</body>
</html>
