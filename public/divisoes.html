<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ñ - ÑÊMESIS // Divisões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080808; --panel:#0f0f10; --panel-2:#151516; --blood:#8B0000;
    --signal:#C1121F; --signal-soft: rgba(193,18,31,0.35); --steel:#9a9a9a;
    --white:#eaeaea; --line: rgba(193,18,31,0.22);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--void); color:var(--white); font-family:'Rajdhani', sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wordmark{ font-family:'Audiowide', sans-serif; letter-spacing:0.04em; }
  main{ max-width:1180px; margin:0 auto; padding:140px 6vw 100px; }
  .voltar{ display:inline-block; font-size:0.78rem; letter-spacing:0.08em; color:var(--steel); text-transform:uppercase; margin-bottom:34px; }
  .voltar:hover{ color:var(--signal); }
  h1{ font-family:'Audiowide'; font-size:clamp(1.7rem,4vw,2.6rem); }
  .subtitulo{ margin-top:14px; color:var(--steel); line-height:1.6; max-width:560px; }
  .grade{ margin-top:50px; display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
  .cartao{ background:var(--panel); padding:32px 28px; }
  .cartao .selo{ font-family:'Audiowide'; font-size:0.7rem; color:var(--signal); letter-spacing:0.12em; margin-bottom:12px; }
  .cartao h3{ font-family:'Audiowide'; font-size:1rem; margin-bottom:12px; letter-spacing:0.02em; }
  .cartao p{ color:var(--steel); font-size:0.88rem; line-height:1.6; }
  .carregando{ color:var(--steel); font-size:0.9rem; }
</style>
</head>
<body>

<main>
  <a class="voltar" href="/">← Voltar pra home</a>
  <h1 class="wordmark">Divisões da NÊMESIS</h1>
  <p class="subtitulo">Como a estrutura interna é organizada, área por área.</p>
  <div class="grade" id="grade">
    <p class="carregando">Carregando…</p>
  </div>
</main>

<script>
  fetch('/.netlify/functions/site-conteudo-get')
    .then(r => r.json())
    .then(conteudo => {
      const grade = document.getElementById('grade');
      grade.innerHTML = '';
      if(!conteudo.divisoes.length){
        grade.innerHTML = '<p class="carregando">Nenhuma divisão cadastrada ainda.</p>';
        return;
      }
      conteudo.divisoes.forEach((d, i) => {
        const cartao = document.createElement('div');
        cartao.className = 'cartao';
        cartao.innerHTML = `
          <div class="selo">DIVISÃO ${String(i+1).padStart(2,'0')}</div>
          <h3>${d.nome}</h3>
          <p>${d.descricao}</p>
        `;
        grade.appendChild(cartao);
      });
    })
    .catch(() => {
      document.getElementById('grade').innerHTML = '<p class="carregando">Não deu pra carregar o conteúdo agora.</p>';
    });
</script>
</body>
</html>
