<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Ñ - ÑÊMESIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="topo">
    <div class="marca">Ñ - ÑÊMESIS — PAINEL</div>
    <div>
      <span id="nome-usuario" style="margin-right:16px; color:var(--steel); font-size:0.85rem;"></span>
      <a href="/logout" class="botao">Sair</a>
    </div>
  </div>

  <div class="layout">
    <div class="barra-lateral">
      <h3>SEUS SERVIDORES</h3>
      <div id="lista-servidores">Carregando...</div>
    </div>

    <div class="conteudo" id="conteudo">
      <p style="color:var(--steel)">Selecione um servidor na barra ao lado pra começar.</p>
    </div>
  </div>

  <script>
    window.onerror = function (msg, url, linha, coluna, erro) {
      var el = document.getElementById('lista-servidores');
      if (el) {
        el.innerHTML = '<p style="color:#ff1a2e; font-size:0.7rem; word-break:break-all; white-space:pre-wrap;">ERRO NO APP.JS:\n' + msg + '\n(linha ' + linha + ', coluna ' + coluna + ')</p>';
      }
      return false;
    };
  </script>
  <script src="/app.js"></script>
</body>
</html>
