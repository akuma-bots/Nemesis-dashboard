<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel — N - NÊMESIS</title>

<link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;600&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/tema-nemesis.css">

</head>

<body>

  <div class="topo">

    <div class="marca">
      N - NÊMESIS — PAINEL
    </div>

    <div>

      <span
        id="nome-usuario"
        style="
          margin-right:16px;
          color:var(--steel);
          font-size:0.85rem;
        "
      ></span>

      <a href="/logout" class="botao">
        Sair
      </a>

    </div>

  </div>


  <div class="layout">

    <div class="barra-lateral">

      <h3>
        SEUS SERVIDORES
      </h3>

      <div id="lista-servidores">
        Carregando...
      </div>

    </div>


    <div
      class="conteudo"
      id="conteudo"
    >

      <p style="color:var(--steel)">
        Selecione um servidor na barra ao lado pra começar.
      </p>

    </div>

  </div>


  <script>

    window.onerror = function (
      mensagem,
      url,
      linha,
      coluna,
      erro
    ) {

      console.error(
        "Erro no painel NÊMESIS:",
        {
          mensagem,
          url,
          linha,
          coluna,
          erro
        }
      );

      const elemento =
        document.getElementById("lista-servidores");

      if (elemento) {

        elemento.innerHTML = `
          <p
            style="
              color:var(--signal);
              font-size:0.78rem;
              line-height:1.5;
            "
          >
            Ocorreu um erro ao carregar o painel.
            Atualize a página e tente novamente.
          </p>
        `;

      }

      return false;
    };

  </script>


  <script src="/app.js"></script>

</body>
</html>
