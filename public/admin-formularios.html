<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ñ - ÑÊMESIS // Editar Candidaturas</title>
<link rel="stylesheet" href="/tema-nemesis.css">
</head>
<body>
<main class="pagina" style="max-width:860px">
  <a class="voltar" href="/">← Voltar</a>
  <h1>Editar Candidaturas</h1>
  <p class="sub">Monte formulários por etapas e revise as candidaturas recebidas.</p>

  <div id="tela-carregando" class="estado-central"><p>Verificando login…</p></div>
  <div id="tela-login" class="estado-central" style="display:none"><p>Entre com Discord para editar.</p><a class="btn btn-primario" href="/login">Entrar com Discord</a></div>
  <div id="tela-negado" class="estado-central" style="display:none"><p>Você não gerencia o servidor da NÊMESIS.</p></div>

  <div id="tela-editor" style="display:none">
    <div class="bloco"><h4>CANDIDATURAS PENDENTES</h4><div id="pendentes"></div></div>

    <div class="bloco">
      <h4>FORMULÁRIOS</h4>
      <div id="editor-forms"></div>
      <div class="linha-acoes">
        <button class="btn btn-secundario" type="button" onclick="novoForm()">+ Novo formulário</button>
        <button class="btn btn-secundario" type="button" onclick="novoFormularioPadrao()">+ Modelo padrão — Recrutamento Staff</button>
        <button class="btn btn-secundario" type="button" onclick="novoFormularioRecrutamento()">+ Modelo padrão — Recrutamento</button>
        <button class="btn btn-secundario" type="button" onclick="novoFormularioParceria()">+ Modelo padrão — Parceria</button>
        <button class="btn btn-primario" type="button" onclick="salvar()">Salvar formulários</button>
      </div>
      <p class="status" id="status"></p>
    </div>

    <div class="bloco"><h4>HISTÓRICO RECENTE</h4><div id="historico"></div></div>
  </div>
</main>

<script>
function h(tag, props, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else if (k !== 'value') e.setAttribute(k, v === true ? '' : v);
  }
  filhos.flat().forEach((f) => e.append(f instanceof Node ? f : document.createTextNode(f == null ? '' : f)));
  if (props && props.value !== undefined) e.value = props.value;
  return e;
}
const $ = (s) => document.querySelector(s);
let dados = { formularios: [], respostas: [], cargos: [], canais: [] };

function mostrar(id) {
  ['tela-carregando', 'tela-login', 'tela-negado', 'tela-editor'].forEach((t) => { $('#' + t).style.display = t === id ? '' : 'none'; });
}
function avisar(msg) {
  const el = $('#status'); el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}
function novoId(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function alternar(lista, valor, ligado) {
  const i = lista.indexOf(valor);
  if (ligado && i < 0) lista.push(valor);
  if (!ligado && i >= 0) lista.splice(i, 1);
}
function campo(rotulo, entrada) { return h('div', { class: 'campo' }, h('label', {}, rotulo), entrada); }

function normalizar(f) {
  f.titulo = f.titulo || f.titulo_painel || f.nome || '';
  f.descricao = f.descricao || f.descricao_painel || '';
  f.cargosNotificar = f.cargosNotificar || f.cargos_notificar || [];
  f.canalNotificacaoId = f.canalNotificacaoId || f.canal_notificacao_id || '';
  f.paginas = f.paginas || [];
  f.paginas.forEach((p) => { p.perguntas = p.perguntas || []; p.perguntas.forEach((q) => { q.opcoes = q.opcoes || []; }); });
}

async function iniciar() {
  let r;
  try { r = await fetch('/.netlify/functions/formularios-admin-get'); } catch (e) { return mostrar('tela-login'); }
  if (r.status === 401) return mostrar('tela-login');
  if (r.status === 403) return mostrar('tela-negado');
  dados = await r.json();
  dados.formularios.forEach(normalizar);
  desenharEditor(); desenharRespostas(); mostrar('tela-editor');
}

function novoForm() {
  dados.formularios.push({ id: novoId('form'), titulo: 'Novo formulário', descricao: '', ativo: false, cargosNotificar: [], canalNotificacaoId: '', paginas: [{ titulo: 'Etapa 1', perguntas: [] }] });
  desenharEditor();
}

function novoFormularioPadrao() {
  const existe = dados.formularios.some((f) =>
    String(f.titulo || f.titulo_painel || f.nome || '').toLowerCase() === 'recrutamento staff'
  );
  if (existe && !confirm('Já existe um formulário chamado Recrutamento Staff. Deseja adicionar outro modelo mesmo assim?')) return;

  dados.formularios.push({
    id: novoId('form'),
    titulo: '✦・ 𝐍̷Ê𝐌𝐄𝐒𝐈𝐒 — 𝐑𝐄𝐂𝐑𝐔𝐓𝐀𝐌𝐄𝐍𝐓𝐎 𝐒𝐓𝐀𝐅𝐅 ・✦',
    descricao: '⟡・ A NÊMESIS está recrutando novos integrantes para sua equipe administrativa. Procuramos pessoas responsáveis, maduras e comprometidas, dispostas a contribuir para a organização, o crescimento e o desenvolvimento da gangue.\n\n╭─────────────── ◈ ───────────────╮\n\n⚔️・| 𝐎 𝐐𝐔𝐄 𝐏𝐑𝐎𝐂𝐔𝐑𝐀𝐌𝐎𝐒\n➜ Responsabilidade, maturidade e postura;\n➜ Comunicação clara e respeitosa;\n➜ Atividade e participação consistente;\n➜ Capacidade de trabalhar em equipe;\n➜ Imparcialidade na resolução de conflitos;\n➜ Compromisso com as funções assumidas;\n➜ Respeito às regras, à hierarquia e às decisões administrativas;\n➜ Iniciativa para identificar problemas e propor soluções.\n\n╭─────────────── ◈ ───────────────╮\n\n⚔️・| 𝐒𝐎𝐁𝐑𝐄 𝐎 𝐑𝐄𝐂𝐑𝐔𝐓𝐀𝐌𝐄𝐍𝐓𝐎\nA seleção avaliará seu perfil, sua disponibilidade, sua experiência e sua capacidade de contribuir com a equipe. Experiência anterior pode ajudar, mas responsabilidade, honestidade e vontade de evoluir também serão consideradas.\n\n╭─────────────── ◈ ───────────────╮\n\n⚠️・| 𝐈𝐌𝐏𝐎𝐑𝐓𝐀𝐍𝐓𝐄\nResponda a todas as perguntas com atenção, sinceridade e informações completas. Inscrições incompletas, falsas ou feitas sem comprometimento poderão ser desconsideradas. O envio do formulário não garante aprovação. Os candidatos selecionados serão avaliados pela administração da NÊMESIS.\n\n╰─────────────── ◈ ───────────────╯\n\n⟡・ Se você está preparado para assumir responsabilidades, colaborar com a equipe e ajudar a fortalecer a NÊMESIS, envie sua candidatura pelo botão abaixo.',
    ativo: true,
    cargosNotificar: [],
    canalNotificacaoId: '',
    paginas: [
      {
        titulo: 'Perfil do candidato',
        perguntas: [
          { id: novoId('q'), texto: 'Como prefere ser chamado e qual é seu usuário no Discord?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Qual é sua disponibilidade para atuar na equipe?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Por que deseja fazer parte da Staff da NÊMESIS?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Você já teve experiência em equipes administrativas? Se sim, descreva.', tipo: 'longa', obrigatoria: true, opcoes: [] }
        ]
      },
      {
        titulo: 'Responsabilidade e conduta',
        perguntas: [
          { id: novoId('q'), texto: 'Como agiria diante de um conflito entre dois membros?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'O que faria se outro integrante da Staff desrespeitasse as regras?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Quais habilidades você pode oferecer à NÊMESIS?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Você compreende que o cargo exige imparcialidade, discrição e compromisso?', tipo: 'escolha', obrigatoria: true, opcoes: ['Sim, compreendo e aceito', 'Preciso esclarecer algumas dúvidas'] }
        ]
      }

  });
  desenharEditor();
  avisar('Modelo padrão de Recrutamento Staff adicionado. Revise os cargos e o canal antes de salvar.');

    /recrutamento/i.test(String(f.titulo || f.titulo_painel || f.nome || '')) &&
    !/staff/i.test(String(f.titulo || f.titulo_painel || f.nome || ''))

  dados.formularios.push({
    id: novoId('form'),
    titulo: '✦・ 𝐍̷Ê𝐌𝐄𝐒𝐈𝐒 — RECRUTAMENTO ・✦',
    descricao: '⟡・ Faça parte da NÊMESIS.\nA NÊMESIS está em busca de novos membros para fortalecer sua estrutura, ampliar sua presença e construir uma equipe ativa, comprometida e competitiva.\n\n╭─────────────── ◈ ───────────────╮\n⚔️・| RECRUTAMENTO ABERTO\n➜ Buscamos jogadores ativos, responsáveis e dispostos a participar das atividades da NÊMESIS.\n➜ Valorizamos atividade, respeito, lealdade, comunicação e trabalho em equipe.\n➜ A entrada será avaliada de acordo com o perfil, a postura e o comprometimento de cada candidato.\n➜ Procuramos membros que desejam evoluir, participar de eventos, enfrentar desafios e contribuir para o crescimento da gangue.\n\n╭─────────────── ◈ ───────────────╮\n⚔️・| O QUE OFERECEMOS\n➜ Participação em eventos, desafios e atividades competitivas.\n➜ Oportunidades de evolução e reconhecimento dentro da estrutura.\n➜ Interação com outros jogadores e formação de equipes.\n➜ Sistemas de missões, contribuições, pontuação e rankings.\n➜ Um ambiente organizado, com objetivos, funções e oportunidades para membros dedicados.\n\n╭─────────────── ◈ ───────────────╮\n⚠️・| REQUISITOS\n➜ Respeitar os membros, a hierarquia e as regras da NÊMESIS.\n➜ Manter uma postura adequada e evitar conflitos desnecessários.\n➜ Demonstrar interesse em participar das atividades.\n➜ Preencher o formulário com informações verdadeiras.\n\n╭─────────────── ◈ ───────────────╮\n⚔️・| ANTES DE SE INSCREVER\nLeia as informações com atenção e responda às perguntas com sinceridade. O envio da candidatura não garante entrada automática. A administração poderá avaliar cada inscrição antes de confirmar a aprovação.\n\n╰─────────────── ◈ ───────────────╯\n\n⟡・ Está pronto para fazer parte da NÊMESIS? Clique em Preencher Formulário, responda às perguntas e aguarde a avaliação da equipe.',

          { id: novoId('q'), texto: 'Qual jogo ou jogos você costuma jogar?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Como conheceu a NÊMESIS?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Qual é sua disponibilidade para participar das atividades?', tipo: 'longa', obrigatoria: true, opcoes: [] }
        ]
      },
      {
        titulo: 'Participação e compromisso',
        perguntas: [
          { id: novoId('q'), texto: 'O que motivou você a entrar para a NÊMESIS?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Em quais atividades você tem mais interesse? (eventos, PvP, missões, equipes ou outras)', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Como você contribuiria para o crescimento e a organização da gangue?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Você concorda em respeitar as regras e os demais membros?', tipo: 'escolha', obrigatoria: true, opcoes: ['Sim, concordo', 'Preciso esclarecer algumas dúvidas'] }
        ]
      }
    ]
  });
  desenharEditor();
  avisar('Modelo padrão de Recrutamento adicionado. Revise os cargos e o canal antes de salvar.');
}

function novoFormularioParceria() {
  const existe = dados.formularios.some((f) =>
    /parceria/i.test(String(f.titulo || f.titulo_painel || f.nome || ''))
  );

  dados.formularios.push({

    titulo: '✦・ 𝐍̷Ê𝐌𝐄𝐒𝐈𝐒 — 𝐅𝐎𝐑𝐌𝐔𝐋𝐀́𝐑𝐈𝐎 𝐃𝐄 𝐏𝐀𝐑𝐂𝐄𝐑𝐈𝐀 ・✦',
    descricao: '⟡・ Este formulário é destinado a comunidades, organizações e projetos interessados em estabelecer uma parceria com a NÊMESIS.\n\n╭─────────────── ◈ ───────────────╮\n🤝・| 𝐎 𝐎𝐁𝐉𝐄𝐓𝐈𝐕𝐎\n╰─────────────── ◈ ───────────────╯\n\nAtravés deste formulário, sua comunidade poderá apresentar sua proposta de colaboração, possibilitando que ambas as partes conheçam seus objetivos e definam uma parceria de forma organizada.\n\n╭─────────────── ◈ ───────────────╮\n🤝・| 𝐏𝐑𝐎𝐏𝐎𝐒𝐓𝐀 𝐃𝐄 𝐂𝐎𝐋𝐀𝐁𝐎𝐑𝐀𝐂̧𝐀̃𝐎\n╰─────────────── ◈ ───────────────╯\n\nBuscamos estabelecer parcerias que proporcionem benefícios mútuos, incentivem a interação entre os membros e ampliem as oportunidades para ambas as organizações. As propostas podem envolver divulgação, integração entre comunidades, eventos conjuntos, iniciativas competitivas e outras formas de colaboração. As condições serão definidas entre os representantes, de acordo com os objetivos e as possibilidades de cada parte.\n\n╭─────────────── ◈ ───────────────╮\n🤝・| 𝐂𝐎𝐌𝐎 𝐅𝐔𝐍𝐂𝐈𝐎𝐍𝐀\n╰─────────────── ◈ ───────────────╯\n\n➜ Preencha todas as informações solicitadas com clareza.\n➜ Apresente os objetivos e os benefícios da parceria proposta.\n➜ Informe as formas de divulgação e colaboração disponíveis.\n➜ Aguarde a análise da equipe responsável pela NÊMESIS.\n➜ Caso a proposta seja aprovada, os representantes poderão alinhar os detalhes e as condições da parceria.\n\n╭─────────────── ◈ ───────────────╮\n⚠️・| 𝐈𝐍𝐅𝐎𝐑𝐌𝐀𝐂̧𝐎̃𝐄𝐒 𝐈𝐌𝐏𝐎𝐑𝐓𝐀𝐍𝐓𝐄𝐒\n╰─────────────── ◈ ───────────────╯\n\n➜ Todas as informações devem ser verdadeiras e estar atualizadas.\n➜ A proposta deve apresentar condições claras e objetivos compatíveis com uma colaboração mútua.\n➜ O envio do formulário não garante a aprovação da parceria.\n➜ A NÊMESIS poderá recusar propostas que não atendam aos critérios estabelecidos pela organização.\n\n╰─────────────── ◈ ───────────────╯\n\n⟡・ Agradecemos pelo interesse em estabelecer uma parceria com a NÊMESIS. Preencha o formulário com atenção para que nossa equipe possa avaliar sua proposta e entrar em contato com o representante responsável.',
    ativo: true,
    cargosNotificar: [],
    canalNotificacaoId: '',
    paginas: [
      {
        titulo: 'Identificação da parceria',
        perguntas: [
          { id: novoId('q'), texto: 'Qual é o nome da sua comunidade, organização ou projeto?', tipo: 'curta', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Envie o convite permanente ou o link oficial da sua comunidade/projeto.', tipo: 'curta', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Qual é o seu nome e usuário no Discord?', tipo: 'curta', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Qual cargo ou função você ocupa e tem autorização para representar a organização?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Quantos membros ativos sua comunidade possui atualmente?', tipo: 'curta', obrigatoria: true, opcoes: [] }
        ]
      },
      {
        titulo: 'Proposta e divulgação',
        perguntas: [
          { id: novoId('q'), texto: 'Qual é o principal objetivo da parceria com a NÊMESIS?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'O que sua organização oferece à NÊMESIS e quais benefícios espera receber?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Quais formas de divulgação ou colaboração vocês podem oferecer?', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Há requisitos, condições ou regras específicas para manter a parceria? Descreva.', tipo: 'longa', obrigatoria: true, opcoes: [] },
          { id: novoId('q'), texto: 'Envie materiais de divulgação, redes sociais ou outras informações relevantes (se houver).', tipo: 'longa', obrigatoria: false, opcoes: [] },
          { id: novoId('q'), texto: 'Deseja acrescentar alguma informação à proposta?', tipo: 'longa', obrigatoria: false, opcoes: [] }
        ]
      }
    ]
  });
  desenharEditor();
  avisar('Modelo padrão de Parceria adicionado. Revise os cargos e o canal antes de salvar.');
}

function desenharEditor() {
  const cont = $('#editor-forms');
  if (!dados.formularios.length) { cont.replaceChildren(h('p', { class: 'vazio' }, 'Nenhum formulário ainda.')); return; }
  cont.replaceChildren(...dados.formularios.map((f, fi) => blocoForm(f, fi)));
}

function blocoForm(f, fi) {
  const canais = h('select', { value: f.canalNotificacaoId, onchange: (e) => { f.canalNotificacaoId = e.target.value; } },
    h('option', { value: '' }, '— nenhum —'),
    dados.canais.map((c) => h('option', { value: c.id }, '#' + c.nome)));
  const cargos = h('div', { class: 'caixa-check' }, dados.cargos.length
    ? dados.cargos.map((c) => h('label', { class: 'check' },
        h('input', { type: 'checkbox', checked: f.cargosNotificar.includes(c.id), onchange: (e) => alternar(f.cargosNotificar, c.id, e.target.checked) }), c.nome))
    : h('span', { class: 'texto-suave' }, 'Não consegui listar os cargos do servidor.'));

  return h('div', { class: 'bloco', style: 'background:var(--void)' },
    campo('Título', h('input', { type: 'text', value: f.titulo, oninput: (e) => { f.titulo = e.target.value; } })),
    campo('Descrição', h('textarea', { rows: '2', value: f.descricao, oninput: (e) => { f.descricao = e.target.value; } })),
    h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: f.ativo, onchange: (e) => { f.ativo = e.target.checked; } }), 'Formulário aberto (visível no site)'),
    campo('Cargos que recebem DM a cada candidatura', cargos),
    campo('Canal de aviso (opcional — também marca os cargos acima)', canais),
    f.paginas.map((p, pi) => blocoPagina(f, p, pi)),
    h('div', { class: 'linha-acoes' },
      h('button', { class: 'btn btn-secundario', type: 'button', onclick: () => { f.paginas.push({ titulo: 'Etapa ' + (f.paginas.length + 1), perguntas: [] }); desenharEditor(); } }, '+ Etapa'),
      h('button', { class: 'btn btn-secundario btn-remover', type: 'button', onclick: () => { if (confirm('Remover este formulário?')) { dados.formularios.splice(fi, 1); desenharEditor(); } } }, 'Remover formulário')));
}

function blocoPagina(f, p, pi) {
  return h('div', { class: 'bloco', style: 'margin-top:18px' },
    campo('Etapa ' + (pi + 1) + ' — título', h('input', { type: 'text', value: p.titulo, oninput: (e) => { p.titulo = e.target.value; } })),
    p.perguntas.map((q, qi) => blocoPergunta(p, q, qi)),
    h('div', { class: 'linha-acoes' },
      h('button', { class: 'btn btn-secundario', type: 'button', onclick: () => { p.perguntas.push({ id: novoId('q'), texto: 'Nova pergunta', tipo: 'curta', obrigatoria: true, opcoes: [] }); desenharEditor(); } }, '+ Pergunta'),
      f.paginas.length > 1 ? h('button', { class: 'btn btn-secundario btn-remover', type: 'button', onclick: () => { f.paginas.splice(pi, 1); desenharEditor(); } }, 'Remover etapa') : null));
}

function blocoPergunta(p, q, qi) {
  return h('div', { class: 'bloco', style: 'background:var(--panel-2);padding:18px' },
    campo('Pergunta', h('input', { type: 'text', value: q.texto, oninput: (e) => { q.texto = e.target.value; } })),
    h('div', { class: 'linha' },
      campo('Tipo', h('select', { value: q.tipo, onchange: (e) => { q.tipo = e.target.value; desenharEditor(); } },
        h('option', { value: 'curta' }, 'Resposta curta'),
        h('option', { value: 'longa' }, 'Resposta longa'),
        h('option', { value: 'escolha' }, 'Múltipla escolha'))),
      h('label', { class: 'check', style: 'align-self:end;padding-bottom:12px' },
        h('input', { type: 'checkbox', checked: q.obrigatoria, onchange: (e) => { q.obrigatoria = e.target.checked; } }), 'Obrigatória')),
    q.tipo === 'escolha'
      ? campo('Opções (uma por linha)', h('textarea', { rows: '3', value: q.opcoes.join('\n'), oninput: (e) => { q.opcoes = e.target.value.split('\n').map((o) => o.trim()).filter(Boolean); } }))
      : null,
    h('div', { class: 'linha-acoes' },
      h('button', { class: 'btn btn-secundario btn-remover', type: 'button', onclick: () => { p.perguntas.splice(qi, 1); desenharEditor(); } }, 'Remover pergunta')));
}

async function salvar() {
  const resp = await fetch('/.netlify/functions/formularios-save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ formularios: dados.formularios }),
  });
  if (resp.status === 403) return mostrar('tela-negado');
  avisar(resp.ok ? 'Formulários salvos — já valem para o site.' : 'Não deu pra salvar.');
}

function desenharRespostas() {
  const ordenar = (a, b) => b.criadoEm - a.criadoEm;
  const pend = dados.respostas.filter((r) => r.status === 'pendente').sort(ordenar);
  const hist = dados.respostas.filter((r) => r.status !== 'pendente').sort(ordenar).slice(0, 15);
  $('#pendentes').replaceChildren(...(pend.length ? pend.map((r) => cartaoResposta(r, true)) : [h('p', { class: 'vazio' }, 'Nenhuma candidatura pendente.')]));
  $('#historico').replaceChildren(...(hist.length ? hist.map((r) => cartaoResposta(r, false)) : [h('p', { class: 'vazio' }, 'Sem histórico ainda.')]));
}

function cartaoResposta(r, revisavel) {
  const msg = h('input', { type: 'text', placeholder: 'Mensagem para o candidato (opcional)' });
  return h('div', { class: 'bloco', style: 'background:var(--void)' },
    h('strong', {}, r.nome),
    h('span', { class: 'texto-suave' }, ' — ' + r.formTitulo + ' · ' + new Date(r.criadoEm).toLocaleString('pt-BR') + (revisavel ? '' : ' · ' + r.status)),
    (r.itens || []).map((i) => h('div', { class: 'qa' }, h('strong', {}, i.pergunta), h('p', {}, i.resposta))),
    revisavel ? h('div', { style: 'margin-top:16px' }, msg,
      h('div', { class: 'linha-acoes' },
        h('button', { class: 'btn btn-secundario', type: 'button', style: 'background:var(--white);color:#000', onclick: () => revisar(r, 'aprovada', msg.value) }, 'Aprovar'),
        h('button', { class: 'btn btn-secundario btn-remover', type: 'button', onclick: () => revisar(r, 'recusada', msg.value) }, 'Recusar'))) : null);
}

async function revisar(r, decisao, mensagem) {
  if (decisao === 'recusada' && !confirm('Recusar esta candidatura?')) return;
  const resp = await fetch('/.netlify/functions/formularios-revisar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ respostaId: r.id, decisao, mensagem }),
  });
  if (resp.status === 403) return mostrar('tela-negado');
  if (!resp.ok) return avisar('Não deu pra revisar.');
  r.status = decisao;
  desenharRespostas();
}

iniciar();
</script>
