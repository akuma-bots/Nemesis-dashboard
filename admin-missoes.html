<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ñ - ÑÊMESIS // Editar Missões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080808; --panel:#0f0f10; --panel-2:#151516; --blood:#3a3a3a;
    --signal:#ffffff; --signal-soft: rgba(255,255,255,0.25); --steel:#9a9a9a;
    --white:#eaeaea; --line: rgba(255,255,255,0.16);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--void); color:var(--white); font-family:'Rajdhani', sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wordmark{ font-family:'Audiowide', sans-serif; letter-spacing:0.04em; }
  main{ max-width:820px; margin:0 auto; padding:140px 6vw 100px; }
  .voltar{ display:inline-block; font-size:0.78rem; letter-spacing:0.08em; color:var(--steel); text-transform:uppercase; margin-bottom:34px; }
  .voltar:hover{ color:var(--signal); }
  h1{ font-family:'Audiowide'; font-size:1.7rem; margin-bottom:8px; }
  .sub{ color:var(--steel); margin-bottom:30px; }
  .estado-central{ text-align:center; padding:60px 20px; border:1px solid var(--line); background:var(--panel); }
  .estado-central p{ color:var(--steel); margin-bottom:20px; }
  .btn{
    font-family:'Rajdhani'; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
    font-size:0.85rem; padding:13px 28px; cursor:pointer; border:1px solid var(--signal);
    background:transparent; color:var(--white); transition:all .25s; display:inline-block;
  }
  .btn-primario{ background:var(--signal); color:#080808; }
  .btn-primario:hover{ opacity:0.85; }
  .bloco{ border:1px solid var(--line); background:var(--panel-2); padding:22px; margin-bottom:24px; }
  .bloco h4{ font-family:'Audiowide'; font-size:0.78rem; color:var(--signal); letter-spacing:0.04em; margin-bottom:16px; }
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel); margin-bottom:6px; }
  .campo input, .campo select, .campo textarea{
    width:100%; background:var(--void); border:1px solid var(--line); color:var(--white);
    font-family:'Rajdhani'; font-size:0.92rem; padding:9px 12px;
  }
  .linha{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .linha{ grid-template-columns:1fr; } }
  .item-editor{ border:1px solid var(--line); padding:14px; margin-bottom:12px; background:var(--panel); }
  .linha-acoes{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .btn-secundario{
    font-family:'Rajdhani'; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; font-size:0.74rem;
    padding:8px 16px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--steel); transition:all .2s;
  }
  .btn-secundario:hover{ border-color:var(--signal); color:var(--white); }
  .btn-remover{ border-color:#666; color:var(--signal); }
  .status{ font-size:0.8rem; color:var(--signal); margin-top:12px; min-height:1.2em; }
  .submissao{ border:1px solid var(--line); background:var(--panel); padding:14px; margin-bottom:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .submissao img{ width:120px; height:120px; object-fit:cover; border:1px solid var(--line); }
  .submissao .info{ flex:1; min-width:180px; }
  .submissao .info strong{ display:block; margin-bottom:4px; }
  .submissao .info span{ color:var(--steel); font-size:0.82rem; display:block; }
  .checkbox-linha{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-linha input{ width:auto; }
</style>
</head>
<body>

<main>
  <a class="voltar" href="/">← Voltar pra home</a>
  <h1 class="wordmark">Editar Missões</h1>
  <p class="sub">Cadastre missões PvP/PvE e revise os prints enviados como prova.</p>

  <div id="tela-carregando" class="estado-central"><p>Verificando login…</p></div>
  <div id="tela-login" class="estado-central" style="display:none;">
    <p>Você precisa entrar com Discord pra editar.</p>
    <a href="/login" class="btn btn-primario">Entrar com Discord</a>
  </div>
  <div id="tela-sem-permissao" class="estado-central" style="display:none;">
    <p>Você está logado, mas não gerencia o servidor da NÊMESIS.</p>
  </div>

  <div id="tela-editor" style="display:none;">

    <div class="bloco">
      <h4>SUBMISSÕES PENDENTES</h4>
      <div id="lista-pendentes"></div>
    </div>

    <div class="bloco">
      <h4>CATÁLOGO DE MISSÕES</h4>
      <div id="lista-missoes"></div>
      <div class="linha-acoes">
        <button class="btn-secundario" onclick="adicionarMissao()">+ Adicionar missão</button>
        <button class="btn btn-primario" onclick="salvarMissoes()" style="padding:10px 20px; font-size:0.76rem;">Salvar catálogo</button>
      </div>
      <div class="status" id="status-missoes"></div>
    </div>

  </div>
</main>

<script>
  let missoes = [];
  let submissoes = [];

  function mostrar(id){
    ['tela-carregando','tela-login','tela-sem-permissao','tela-editor'].forEach(t => {
      document.getElementById(t).style.display = (t === id) ? '' : 'none';
    });
  }
  function avisar(idStatus, msg){
    const el = document.getElementById(idStatus);
    el.textContent = msg;
    setTimeout(() => { if(el.textContent === msg) el.textContent = ''; }, 4000);
  }
  function escaparHtml(texto){
    return String(texto ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function iniciar(){
    let resp;
    try{ resp = await fetch('/.netlify/functions/missoes-admin-get'); }catch(e){ mostrar('tela-login'); return; }
    if(resp.status === 401){ mostrar('tela-login'); return; }
    if(resp.status === 403){ mostrar('tela-sem-permissao'); return; }
    const dados = await resp.json();
    missoes = dados.missoes;
    submissoes = dados.submissoes;
    renderMissoes();
    renderPendentes();
    mostrar('tela-editor');
  }

  function renderMissoes(){
    const lista = document.getElementById('lista-missoes');
    lista.innerHTML = '';
    missoes.forEach((m, i) => {
      const div = document.createElement('div');
      div.className = 'item-editor';
      div.innerHTML = `
        <div class="linha">
          <div class="campo"><label>Título</label><input type="text" data-i="${i}" data-campo="titulo" value="${m.titulo || ''}"></div>
          <div class="campo">
            <label>Tipo</label>
            <select data-i="${i}" data-campo="tipo">
              <option value="pvp" ${m.tipo === 'pvp' ? 'selected' : ''}>PvP</option>
              <option value="pve" ${m.tipo === 'pve' ? 'selected' : ''}>PvE</option>
            </select>
          </div>
        </div>
        <div class="campo"><label>Descrição</label><textarea rows="2" data-i="${i}" data-campo="descricao">${m.descricao || ''}</textarea></div>
        <div class="campo" style="max-width:160px;"><label>Pontos</label><input type="number" data-i="${i}" data-campo="pontos" value="${m.pontos || 0}"></div>
        <div class="checkbox-linha">
          <input type="checkbox" id="ativa-${i}" data-i="${i}" data-campo="ativa" ${m.ativa ? 'checked' : ''}>
          <label for="ativa-${i}" style="margin:0; text-transform:none; font-size:0.85rem;">Missão ativa (visível no site)</label>
        </div>
        <div class="linha-acoes"><button class="btn-secundario btn-remover" onclick="removerMissao(${i})">Remover</button></div>
      `;
      lista.appendChild(div);
    });
    lista.querySelectorAll('input,select,textarea').forEach(campo => {
      const evento = campo.type === 'checkbox' ? 'change' : 'input';
      campo.addEventListener(evento, e => {
        const i = e.target.dataset.i, k = e.target.dataset.campo;
        if(k === 'ativa') missoes[i][k] = e.target.checked;
        else if(k === 'pontos') missoes[i][k] = Number(e.target.value);
        else missoes[i][k] = e.target.value;
      });
    });
  }

  function adicionarMissao(){
    missoes.push({ id: 'missao_' + Date.now(), tipo: 'pvp', titulo: 'Nova missão', descricao: '', pontos: 10, ativa: true });
    renderMissoes();
  }
  function removerMissao(i){
    missoes.splice(i, 1);
    renderMissoes();
  }
  async function salvarMissoes(){
    try{
      const resp = await fetch('/.netlify/functions/missoes-catalogo-save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ missoes }),
      });
      if(resp.status === 403){ mostrar('tela-sem-permissao'); return; }
      if(!resp.ok) throw new Error();
      avisar('status-missoes', 'Catálogo salvo.');
    }catch(e){ avisar('status-missoes', 'Não deu pra salvar.'); }
  }

  function renderPendentes(){
    const lista = document.getElementById('lista-pendentes');
    const pendentes = submissoes.filter(s => s.status === 'pendente');
    if(!pendentes.length){ lista.innerHTML = '<p style="color:var(--steel); font-size:0.88rem;">Nenhuma submissão pendente. 🎉</p>'; return; }
    lista.innerHTML = '';
    pendentes.forEach(s => {
      const div = document.createElement('div');
      div.className = 'submissao';
      div.innerHTML = `
        <img src="${s.imagemBase64}" alt="prova">
        <div class="info">
          <strong>${escaparHtml(s.nome)}</strong>
          <span>Missão: ${escaparHtml(s.missaoTitulo)} (+${s.missaoPontos} pts)</span>
          <span>Discord ID: ${escaparHtml(s.discordId)}</span>
          <div class="linha-acoes">
            <button class="btn-secundario" style="border-color:#4caf50; color:#4caf50;" data-id="${s.id}" data-decisao="aprovada">Aprovar</button>
            <button class="btn-secundario btn-remover" data-id="${s.id}" data-decisao="recusada">Recusar</button>
          </div>
        </div>
      `;
      lista.appendChild(div);
    });
    lista.querySelectorAll('button').forEach(btn => {
      btn.onclick = async () => {
        const decisao = btn.dataset.decisao;
        let motivoRecusa = null;
        if(decisao === 'recusada'){
          motivoRecusa = prompt('Motivo da recusa (opcional):') || '';
        }
        try{
          const resp = await fetch('/.netlify/functions/missoes-revisar', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ submissaoId: btn.dataset.id, decisao, motivoRecusa }),
          });
          if(resp.status === 403){ mostrar('tela-sem-permissao'); return; }
          if(!resp.ok) throw new Error();
          const dados = await (await fetch('/.netlify/functions/missoes-admin-get')).json();
          submissoes = dados.submissoes;
          renderPendentes();
        }catch(e){ alert('Não deu pra revisar essa submissão.'); }
      };
    });
  }

  iniciar();
</script>
</body>
</html>
